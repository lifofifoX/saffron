name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install without dependency lifecycle scripts
        run: npm ci

      - name: Verify install isolation
        run: |
          test "$(npm config get ignore-scripts)" = "true"
          npm run security:install-state

      - name: Verify registry signatures
        run: npm run security:signatures

      - name: Enforce vulnerability policy
        run: npm run security:audit

      - name: Run unit tests
        run: npm run test:unit

      - name: Type-check application
        run: npm run check

      - name: Run repository lint checks
        run: npm run lint

      - name: Build production artifact
        run: npm run build

      - name: Verify checks did not modify source
        run: npm run security:install-state
